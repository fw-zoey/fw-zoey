name: Update Quote
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Update quote
        run: |
          python3 << 'EOF'
          import urllib.request, json, re

          url = "https://quote.aleph.kr/quote/random"
          with urllib.request.urlopen(url) as res:
            data = json.loads(res.read())

          body = data.get("body", "")
          author = data.get("author", "")

          line = f'> 💬 *"{body}"*'
          if author:
            line += f'  \n> &nbsp;&nbsp;— {author}'

          with open("README.md", "r") as f:
            content = f.read()

          new_content = re.sub(
            r'<!-- QUOTE -->.*?<!-- /QUOTE -->',
            f'<!-- QUOTE -->\n{line}\n<!-- /QUOTE -->',
            content, flags=re.DOTALL
          )

          with open("README.md", "w") as f:
            f.write(new_content)
          EOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update daily quote" || exit 0
          git push
